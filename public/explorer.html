<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API Explorer — AYAKA API</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="/" class="logo">AYAKA API</a><button class="menu-toggle">☰</button><div class="nav-links"><a href="/">Home</a><a href="/documentation.html">Docs</a><a href="/explorer.html" class="active">Explorer</a><a href="/dashboard.html">Dashboard</a></div></div></nav>
<div class="container">
  <h1 style="font-size:2rem;font-weight:900;color:var(--dark);margin-bottom:8px;">API Explorer</h1>
  <p style="color:#6B7280;margin-bottom:24px;">Test AYAKA API endpoints in real-time.</p>
  <div class="explorer-grid">
    <div><div class="card">
      <div class="form-group"><label>Method</label><select id="method"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option></select></div>
      <div class="form-group"><label>URL</label><input type="text" id="url" value="/api/v1/users"></div>
      <div class="form-group"><label>API Key (x-api-key)</label><input type="password" id="apiKey" placeholder="AYK_..."></div>
      <div class="form-group"><label>Request Body (JSON)</label><textarea id="body" placeholder='{"name":"John","email":"john@example.com"}'></textarea></div>
      <div style="display:flex;gap:8px;"><button class="btn btn-primary" id="sendBtn" style="flex:1;">Send Request</button><button class="btn" id="clearBtn">Clear</button></div>
    </div></div>
    <div><div class="card">
      <div style="display:flex;justify-content:space-between;margin-bottom:12px;"><strong>Response</strong><div><span id="statusBadge" class="method-badge" style="display:none;"></span><span id="timeBadge" style="font-size:12px;color:#6B7280;margin-left:8px;"></span></div></div>
      <pre id="responseOut" class="code-output">// Response will appear here</pre>
      <button class="btn btn-sm mt-2" id="copyBtn" style="display:none;">Copy</button>
    </div></div>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
const methodEl = document.getElementById('method'), urlEl = document.getElementById('url'), keyEl = document.getElementById('apiKey'), bodyEl = document.getElementById('body');
const out = document.getElementById('responseOut'), statusBadge = document.getElementById('statusBadge'), timeBadge = document.getElementById('timeBadge'), copyBtn = document.getElementById('copyBtn');
document.getElementById('sendBtn').addEventListener('click', async () => {
  const method = methodEl.value, url = urlEl.value.trim(), key = keyEl.value.trim(), body = bodyEl.value.trim();
  out.textContent = '// Sending...'; statusBadge.style.display = 'none'; copyBtn.style.display = 'none';
  const headers = {}; if (key) headers['x-api-key'] = key; if (body && method !== 'GET' && method !== 'DELETE') headers['Content-Type'] = 'application/json';
  const start = performance.now();
  try {
    const res = await fetch(url, { method, headers, body: (body && method !== 'GET' && method !== 'DELETE') ? body : undefined });
    const elapsed = Math.round(performance.now() - start); let data; try { data = await res.json(); } catch { data = await res.text(); }
    statusBadge.textContent = res.status; statusBadge.className = 'method-badge ' + (res.ok ? 'badge-post' : 'badge-delete'); statusBadge.style.display = 'inline-block'; timeBadge.textContent = elapsed + 'ms';
    out.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2); copyBtn.style.display = 'inline-block';
  } catch (e) { out.textContent = 'Error: ' + e.message; }
});
document.getElementById('clearBtn').addEventListener('click', () => { bodyEl.value = ''; out.textContent = '// Response...'; statusBadge.style.display = 'none'; copyBtn.style.display = 'none'; });
copyBtn.addEventListener('click', () => { navigator.clipboard.writeText(out.textContent); showToast('Copied!', 'success'); });
</script>
</body>
</html>
