<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register — AYAKA API</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="/" class="logo">AYAKA API</a><button class="menu-toggle">☰</button><div class="nav-links"><a href="/">Home</a><a href="/documentation.html">Docs</a><a href="/login.html">Login</a></div></div></nav>
<div class="container" style="max-width:440px;">
  <div class="card">
    <h1 style="font-size:1.75rem;font-weight:900;color:var(--dark);margin-bottom:8px;">Create Account</h1>
    <p style="color:#6B7280;margin-bottom:24px;">Join AYAKA API — start building today.</p>
    <div id="err" class="alert alert-error hidden"></div><div id="msg" class="alert alert-success hidden"></div>
    <form id="registerForm">
      <div class="form-group"><label>Username</label><input type="text" name="username" required minlength="3" maxlength="30"></div>
      <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
      <div class="form-group"><label>Password (min 8 chars)</label><input type="password" name="password" required minlength="8"></div>
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>
    <p class="mt-4 text-center" style="font-size:14px;">Already have an account? <a href="/login.html">Login</a></p>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault(); const fd = new FormData(e.target);
  const err = document.getElementById('err'), msg = document.getElementById('msg');
  err.classList.add('hidden'); msg.classList.add('hidden');
  const { data } = await API.post('/api/auth/register', { username: fd.get('username'), email: fd.get('email'), password: fd.get('password') });
  if (data.success) { msg.textContent = 'Account created! Redirecting...'; msg.classList.remove('hidden'); setTimeout(()=>location.href='/login.html',1200); }
  else { err.textContent = data.message || 'Registration failed'; err.classList.remove('hidden'); }
});
</script>
</body>
</html>
