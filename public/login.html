<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — AYAKA API</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="/" class="logo">AYAKA API</a><button class="menu-toggle">☰</button><div class="nav-links"><a href="/">Home</a><a href="/documentation.html">Docs</a><a href="/register.html">Register</a></div></div></nav>
<div class="container" style="max-width:440px;">
  <div class="card">
    <h1 style="font-size:1.75rem;font-weight:900;color:var(--dark);margin-bottom:24px;">Login</h1>
    <div id="err" class="alert alert-error hidden"></div>
    <form id="loginForm">
      <div class="form-group"><label>Username or Email</label><input type="text" name="identifier" required></div>
      <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <p class="mt-4 text-center" style="font-size:14px;">No account? <a href="/register.html">Register</a></p>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault(); const fd = new FormData(e.target); const err = document.getElementById('err'); err.classList.add('hidden');
  const { data } = await API.post('/api/auth/login', { identifier: fd.get('identifier'), password: fd.get('password') });
  if (data.success) location.href = '/dashboard.html'; else { err.textContent = data.message; err.classList.remove('hidden'); }
});
</script>
</body>
</html>
